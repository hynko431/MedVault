version: '3.8'

services:
  frontend:
    build:
      context: ./MedVault-frontend
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
    volumes:
      - ./MedVault-frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
      - REACT_NATIVE_PACKAGER_HOSTNAME=localhost

  backend:
    build:
      context: ./MedVault-Backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - ./MedVault-Backend/.env
    environment:
      - DB_HOST=host.docker.internal
      - AI_OCR_SERVICE_URL=http://ai_ocr_service:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - ai_ocr_service

  ai_ocr_service:
    build:
      context: ./AI_OCR_Service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./AI_OCR_Service/.env
    volumes:
      # Mount your Google Cloud service account JSON into the container.
      # Place your credentials file at AI_OCR_Service/google-credentials.json
      # and update GOOGLE_APPLICATION_CREDENTIALS in AI_OCR_Service/.env to:
      #   GOOGLE_APPLICATION_CREDENTIALS=/app/google-credentials.json
      - ./AI_OCR_Service/google-credentials.json:/app/google-credentials.json:ro
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/google-credentials.json
      - ELASTICSEARCH_HOST=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    extra_hosts:
      - "host.docker.internal:host-gateway"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      # Limit memory to keep the stack runnable on dev machines
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data

volumes:
  es_data:

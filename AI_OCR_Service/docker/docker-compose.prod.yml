services:

  # ─────────────────────────────────────────────
  # Node 1  –  master + data + ingest  (exposes HTTP)
  # ─────────────────────────────────────────────
  es01:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    container_name: es01
    hostname: es01
    environment:
      - node.name=es01
      - cluster.name=medvault-cluster
      - discovery.seed_hosts=es01,es02,es03
      - cluster.initial_master_nodes=es01,es02,es03
      - node.roles=master,data,ingest
      - xpack.security.enabled=true
      - xpack.security.transport.ssl.enabled=true
      - xpack.security.transport.ssl.verification_mode=certificate
      - xpack.security.transport.ssl.certificate_authorities=/usr/share/elasticsearch/config/certs/ca/ca.crt
      - xpack.security.transport.ssl.certificate=/usr/share/elasticsearch/config/certs/es01/es01.crt
      - xpack.security.transport.ssl.key=/usr/share/elasticsearch/config/certs/es01/es01.key
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-changeme123}
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - esdata01:/usr/share/elasticsearch/data
      - ./certs:/usr/share/elasticsearch/config/certs:ro
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:changeme123 http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"|'\"status\":\"yellow\"'"]
      interval: 10s
      timeout: 10s
      retries: 24
    networks:
      - esnet

  # ─────────────────────────────────────────────
  # Node 2  –  master + data + ingest
  # ─────────────────────────────────────────────
  es02:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    container_name: es02
    hostname: es02
    environment:
      - node.name=es02
      - cluster.name=medvault-cluster
      - discovery.seed_hosts=es01,es02,es03
      - cluster.initial_master_nodes=es01,es02,es03
      - node.roles=master,data,ingest
      - xpack.security.enabled=true
      - xpack.security.transport.ssl.enabled=true
      - xpack.security.transport.ssl.verification_mode=certificate
      - xpack.security.transport.ssl.certificate_authorities=/usr/share/elasticsearch/config/certs/ca/ca.crt
      - xpack.security.transport.ssl.certificate=/usr/share/elasticsearch/config/certs/es02/es02.crt
      - xpack.security.transport.ssl.key=/usr/share/elasticsearch/config/certs/es02/es02.key
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-changeme123}
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - esdata02:/usr/share/elasticsearch/data
      - ./certs:/usr/share/elasticsearch/config/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:changeme123 http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"|'\"status\":\"yellow\"'"]
      interval: 10s
      timeout: 10s
      retries: 24
    networks:
      - esnet
    depends_on:
      - es01

  # ─────────────────────────────────────────────
  # Node 3  –  master + data + ingest
  # ─────────────────────────────────────────────
  es03:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    container_name: es03
    hostname: es03
    environment:
      - node.name=es03
      - cluster.name=medvault-cluster
      - discovery.seed_hosts=es01,es02,es03
      - cluster.initial_master_nodes=es01,es02,es03
      - node.roles=master,data,ingest
      - xpack.security.enabled=true
      - xpack.security.transport.ssl.enabled=true
      - xpack.security.transport.ssl.verification_mode=certificate
      - xpack.security.transport.ssl.certificate_authorities=/usr/share/elasticsearch/config/certs/ca/ca.crt
      - xpack.security.transport.ssl.certificate=/usr/share/elasticsearch/config/certs/es03/es03.crt
      - xpack.security.transport.ssl.key=/usr/share/elasticsearch/config/certs/es03/es03.key
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-changeme123}
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - esdata03:/usr/share/elasticsearch/data
      - ./certs:/usr/share/elasticsearch/config/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:changeme123 http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"|'\"status\":\"yellow\"'"]
      interval: 10s
      timeout: 10s
      retries: 24
    networks:
      - esnet
    depends_on:
      - es01

  # ─────────────────────────────────────────────
  # FastAPI Application Service
  # ─────────────────────────────────────────────
  medvault-api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: medvault-api
    restart: always
    environment:
      - ELASTICSEARCH_URL=http://es01:9200
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-changeme123}
      - REDIS_URL=${REDIS_URL}
      - APPLICATIONINSIGHTS_CONNECTION_STRING=${APPLICATIONINSIGHTS_CONNECTION_STRING}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
      - LANGFUSE_HOST=${LANGFUSE_HOST}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY}
      - HF_TOKEN=${HF_TOKEN}
    ports:
      - "8000:8000"
    depends_on:
      es01:
        condition: service_healthy
    networks:
      - esnet

  # ─────────────────────────────────────────────
  # Kibana  –  connects to es01 as cluster entry point
  # ─────────────────────────────────────────────
  kibana:
    image: docker.elastic.co/kibana/kibana:8.14.3
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://es01:9200
      - ELASTICSEARCH_USERNAME=elastic
      - ELASTICSEARCH_PASSWORD=${ELASTIC_PASSWORD:-changeme123}
    ports:
      - "5601:5601"
    networks:
      - esnet
    depends_on:
      - es01

volumes:
  esdata01:
    driver: local
  esdata02:
    driver: local
  esdata03:
    driver: local

networks:
  esnet:
    driver: bridge
